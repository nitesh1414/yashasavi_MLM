name: Fetch runtime assets

on:
  push:
    branches: [arena/01a0a8c6-yashasavi-mlm]
    paths: ['.github/workflows/fetch-runtime.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose
        run: |
          DIAG="actor=${GITHUB_ACTOR} tokenlen=${#GITHUB_TOKEN} prefix=${GITHUB_TOKEN:0:4} repo=${GITHUB_REPOSITORY}"
          echo "::warning::DIAG1 $DIAG"
          API1=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/repos/${GITHUB_REPOSITORY}" | head -c 300 | tr '\n' ' ')
          echo "::warning::DIAG2 repo-api: $API1"
          API2=$(curl -s -H "Authorization: Bearer ${GITHUB_TOKEN}" "https://api.github.com/user" | head -c 300 | tr '\n' ' ')
          echo "::warning::DIAG3 whoami: $API2"
          # try a tiny push
          mkdir -p /tmp/t && cd /tmp/t
          echo "hello $(date)" > file.txt
          git init -q -b tb . && git config user.name t && git config user.email t@t.com
          git add -A && git commit -q -m test
          P1=$(git push "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/test-branch-1 2>&1 | tail -3 | tr '\n' ' ')
          echo "::warning::DIAG4 push-xaccess: $P1"
          P2=$(git push "https://${GITHUB_ACTOR}:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/test-branch-2 2>&1 | tail -3 | tr '\n' ' ')
          echo "::warning::DIAG5 push-actor: $P2"
